name: "evaluator-feedback-generator"
description: "Evaluates task progress, computes consensus scores, and generates targeted feedback for agents."
input_schema:
  type: object
  properties:
    candidate_solution:
      type: string
      description: "Intermediate or final output generated by task-solving agents."
    evaluation_criteria:
      type: string
      description: "Rubric, ground truth, or benchmark constraints used to assess quality."
    feedback_mode:
      type: string
      enum:
        - "score_only"
        - "detailed_critique"
        - "actionable_revision"
      description: "Format and granularity of evaluation feedback."
      default: "detailed_critique"
  required:
    - candidate_solution
    - evaluation_criteria
